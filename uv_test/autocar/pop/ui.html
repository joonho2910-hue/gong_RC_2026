<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오토카 통합 대시보드</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #f0f0f0; 
            padding: 20px; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            width: 100%; 
            max-width: 800px; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .control-group { 
            margin-bottom: 15px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            justify-content: center; 
        }
        button { 
            padding: 10px 15px; 
            cursor: pointer; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            min-width: 80px;
            transition: all 0.2s;
        }
        button:hover { 
            background: #0056b3; 
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }
        button.stop { 
            background: #dc3545; 
        }
        button.stop:hover {
            background: #c82333;
        }
        input[type="range"] { 
            width: 100%; 
            cursor: pointer;
        }
        input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            flex: 1;
        }
        img#camera { 
            width: 100%; 
            border-radius: 10px; 
            background: #333; 
            min-height: 200px; 
            object-fit: contain;
        }
        label {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>🤖 오토카 통합 제어 대시보드</h1>

    <div class="grid">
        <!-- 카메라 영상 -->
        <div class="card">
            <h3>🎥 라이브 영상</h3>
            <img id="camera" src="" alt="카메라 화면 준비중">
            <button onclick="toggleCamera()">카메라 ON/OFF</button>
        </div>

        <!-- 조이스틱 및 제어 -->
        <div class="card">
            <h3>🎮 조이스틱 & 카메라</h3>
            <div class="control-group">
                <button onclick="sendCommand('forward')">전진</button>
            </div>
            <div class="control-group">
                <button onclick="sendCommand('left')">좌회전</button>
                <button onclick="stopAndSayStop()" class="stop">정지</button>
                <button onclick="sendCommand('right')">우회전</button>
            </div>
            <div class="control-group">
                <button onclick="sendCommand('backward')">후진</button>
            </div>
            
            <div class="control-group" style="flex-direction: column; width: 100%;">
                <label>좌우(Pan): <input type="range" id="pan" min="0" max="180" value="90" oninput="sendPanTilt()"></label>
                <label>상하(Tilt): <input type="range" id="tilt" min="0" max="180" value="90" oninput="sendPanTilt()"></label>
            </div>
        </div>

        <!-- 오디오 제어 -->
        <div class="card">
            <h3>🗣️ 음성 안내</h3>
            <div class="control-group">
                <input type="text" id="ttsText" placeholder="안내 메시지 입력" onkeypress="if(event.key==='Enter') sendTTS()">
                <button onclick="sendTTS()">말하기</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5000"; // 오토카 IP로 변경 필요
        let isLoading = false;

        // ============ 상태 메시지 표시 ============
        function showStatus(message, type = 'info') {
            let statusDiv = document.getElementById('statusBar');
            if (!statusDiv) {
                statusDiv = document.createElement('div');
                statusDiv.id = 'statusBar';
                statusDiv.style.cssText = `
                    position: fixed;
                    top: 10px;
                    right: 10px;
                    padding: 12px 20px;
                    border-radius: 5px;
                    color: white;
                    font-weight: bold;
                    z-index: 9999;
                    max-width: 300px;
                    word-wrap: break-word;
                `;
                document.body.appendChild(statusDiv);
            }
            
            statusDiv.textContent = message;
            statusDiv.style.backgroundColor = {
                'success': '#28a745',
                'error': '#dc3545',
                'warning': '#ffc107',
                'info': '#17a2b8'
            }[type] || '#17a2b8';
            
            statusDiv.style.display = 'block';
            
            // 3초 후 숨김
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }

        // ============ 움직임 제어 ============
        async function sendCommand(action) {
            if (isLoading) return;
            isLoading = true;
            
            try {
                const response = await fetch(`${API_URL}/api/control?action=${action}`, {
                    method: 'GET',
                    signal: AbortSignal.timeout(5000)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                showStatus(`✅ ${action.toUpperCase()} 명령 전송됨`, 'success');
                console.log('제어 응답:', data);
            } catch (error) {
                console.error('제어 오류:', error);
                showStatus(`❌ ${action} 명령 실패: ${error.message}`, 'error');
            } finally {
                isLoading = false;
            }
        }

        // 정지 명령과 TTS를 동시에 수행
        function stopAndSayStop() {
            sendCommand('stop');
            sendTTS("정지합니다.");
        }

        // ============ 팬-틸트 제어 ============
        async function sendPanTilt() {
            const pan = document.getElementById('pan').value;
            const tilt = document.getElementById('tilt').value;
            
            try {
                const response = await fetch(`${API_URL}/api/pantilt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pan: parseInt(pan), tilt: parseInt(tilt) }),
                    signal: AbortSignal.timeout(5000)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                console.log('팬-틸트 설정 완료');
            } catch (error) {
                console.error('팬-틸트 오류:', error);
                showStatus(`❌ 팬-틸트 설정 실패`, 'error');
            }
        }

        // ============ 음성 출력 (TTS) ============
        async function sendTTS(textInput) {
            const text = textInput || document.getElementById('ttsText').value;
            
            if (!text.trim()) {
                showStatus('⚠️ 메시지를 입력하세요', 'warning');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/audio`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'tts', text: text }),
                    signal: AbortSignal.timeout(10000)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                showStatus(`✅ 음성 출력: "${text}"`, 'success');
                console.log('TTS 응답:', data);
            } catch (error) {
                console.error('TTS 오류:', error);
                showStatus(`❌ 음성 출력 실패`, 'error');
            }
        }

        // ============ 카메라 제어 ============
        async function toggleCamera() {
            const cam = document.getElementById('camera');
            const btn = event.target;
            
            if (cam.src) {
                cam.src = "";
                btn.textContent = "카메라 ON";
                showStatus('📹 카메라 OFF', 'info');
            } else {
                btn.textContent = "카메라 OFF (로딩 중...)";
                btn.disabled = true;
                
                try {
                    // 서버 연결 테스트
                    const response = await fetch(`${API_URL}/api/status`, {
                        signal: AbortSignal.timeout(3000)
                    });
                    
                    if (!response.ok) {
                        throw new Error('서버에 연결할 수 없습니다');
                    }
                    
                    cam.src = `${API_URL}/video`;
                    btn.textContent = "카메라 OFF";
                    btn.disabled = false;
                    showStatus('✅ 카메라 ON', 'success');
                } catch (error) {
                    btn.textContent = "카메라 ON";
                    btn.disabled = false;
                    console.error('카메라 오류:', error);
                    showStatus(`❌ 카메라 연결 실패: ${error.message}`, 'error');
                }
            }
        }

        // ============ 페이지 로드 시 서버 연결 확인 ============
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(`${API_URL}/api/status`, {
                    signal: AbortSignal.timeout(3000)
                });
                
                if (response.ok) {
                    const status = await response.json();
                    showStatus('✅ 서버 연결됨', 'success');
                    console.log('서버 상태:', status);
                }
            } catch (error) {
                showStatus(`❌ 서버 미연결: ${API_URL}`, 'error');
                console.warn('서버 연결 실패:', error);
            }
        });
    </script>
</body>
</html>
