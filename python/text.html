<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 메모장</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS: 화면 디자인 (스타일) */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc; /* 부드러운 배경색 */
            color: #334155;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh; /* 화면 전체 높이 사용 */
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.5em;
            color: #4f46e5;
        }

        .action-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 저장 성공 메시지 디자인 */
        #status-msg {
            color: #10b981;
            font-weight: bold;
            opacity: 0; /* 처음에는 투명하게 숨김 */
            transition: opacity 0.3s ease;
        }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
        }

        button:hover {
            background-color: #4338ca; /* 마우스 올리면 약간 어두워짐 */
        }

        textarea {
            flex-grow: 1; /* 남은 화면 공간을 텍스트 상자가 꽉 채움 */
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.1em;
            font-family: inherit;
            resize: none; /* 사용자 임의 크기 조절 방지 */
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: #4f46e5; /* 타이핑 중일 때 테두리 색상 변경 */
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📝 메모장</h1>
        <div class="action-area">
            <span id="status-msg">저장 완료!</span>
            <button onclick="saveMemo()">저장하기</button>
        </div>
    </div>
    
    <textarea id="memo-input" placeholder="여기에 메모를 작성하세요..."></textarea>

    <script>
        /* JavaScript: 파이썬 코드와 통신하는 기능 */
        
        const memoInput = document.getElementById('memo-input');
        const statusMsg = document.getElementById('status-msg');

        // 핵심 1: pywebview가 파이썬과 연결될 때까지 기다림
        window.addEventListener('pywebviewready', function() {
            
            // 핵심 2: 앱이 켜지자마자 파이썬의 load_note() 함수를 호출하여 메모를 불러옴
            window.pywebview.api.load_note().then(function(response) {
                // 파이썬이 보내준 딕셔너리에서 "text" 값을 꺼내서 텍스트 상자에 넣음
                if (response && response.text) {
                    memoInput.value = response.text;
                }
            }).catch(function(error) {
                console.error("메모 불러오기 실패:", error);
            });
            
        });

        // 저장 버튼을 눌렀을 때 실행되는 함수
        function saveMemo() {
            // 텍스트 상자에 적힌 글자를 가져옴
            const currentText = memoInput.value;
            
            // 핵심 3: 파이썬의 save_note() 함수로 글자를 보냄
            window.pywebview.api.save_note(currentText).then(function(response) {
                console.log("저장 상태:", response.status); // 콘솔창에 확인용 출력
                
                // '저장 완료!' 메시지를 나타나게 하고 2초 뒤에 다시 숨김
                statusMsg.style.opacity = 1;
                setTimeout(function() {
                    statusMsg.style.opacity = 0;
                }, 2000);
                
            }).catch(function(error) {
                alert("저장하는 중 문제가 발생했습니다.");
                console.error(error);
            });
        }
    </script>

</body>
</html>
